<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Base</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 색은 모두 --t-* 테마 변수에서 가져온다. 기본은 POSCO 화이트(POSCO CI 전용 색상). */
:root{
  --t-bg:#f7f8f9;--t-surface:#ffffff;--t-surface2:#f4f4f3;--t-line:#e2e2df;--t-text:#000000;--t-muted:#4B5151;
  --t-accent:#05507D;--t-on-accent:#ffffff;--t-title:#05507D;
  --t-work:#05507D;--t-work-soft:#e6eef4;--t-work-ink:#05507D;--t-per:#00A5E5;--t-per-soft:#e0f4fc;--t-per-ink:#4B5151;
  --t-sb:#ffffff;--t-sb-text:#000000;--t-sb-muted:#4B5151;--t-sb-open:#e6eef4;--t-sb-cur-bg:#05507D;--t-sb-cur-text:#ffffff;--t-sb-line:#e2e2df;--t-sb-dot-w:#05507D;--t-sb-dot-p:#00A5E5;
  --hour:48px;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--t-bg);color:var(--t-text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--t-accent);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;height:100%;background:var(--t-bg);color:var(--t-text);transition:background .3s ease}

/* ── 사이드바 ── */
.side{width:256px;flex:none;background:var(--t-sb);color:var(--t-sb-text);border-right:1px solid var(--t-sb-line);padding:20px 12px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:20px;padding:0 10px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border:1px solid var(--t-sb-line);border-radius:6px}
.seg3 button{height:34px;border:0;border-radius:4px;background:none;font-size:13px;color:var(--t-sb-text)}
.seg3 .on{background:var(--t-sb-cur-bg);color:var(--t-sb-cur-text);font-weight:700}
.menu{display:flex;flex-direction:column;gap:2px}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border:0;background:none;border-radius:6px;font-size:15px;color:var(--t-sb-text);text-align:left}
.acc-h .al{flex:1}
.acc.open>.acc-h{background:var(--t-sb-open);font-weight:700}
/* 하부 메뉴가 높이만큼 스윽 펼쳐지며 아래 내용을 밀어 내린다 */
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s ease}
.acc-b>div{overflow:hidden;min-height:0}
.acc.open>.acc-b{grid-template-rows:1fr}
.acc-h .chev{transition:transform .38s ease}
.acc.open>.acc-h .chev{transform:rotate(90deg)}
.acc-b a,.acc-b button{display:flex;align-items:center;width:100%;min-height:36px;margin:1px 0;padding:0 10px 0 40px;border:0;background:none;color:var(--t-sb-muted);font-size:14px;border-radius:4px;text-align:left}
.acc-b .cur{color:var(--t-sb-cur-text);font-weight:700;background:var(--t-sb-cur-bg)}
.dot{width:8px;height:8px;border-radius:50%;margin:0 4px;flex:none}
.mcal{margin-top:auto;border:1px solid var(--t-sb-line);border-radius:6px;padding:10px}
.mcal-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.mcal-h button{width:32px;height:32px;border:0;background:none;color:var(--t-sb-text);border-radius:4px;display:grid;place-items:center}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}
.mg span,.mg button{height:28px;display:grid;place-items:center;border-radius:50%;position:relative;border:0;background:none;color:var(--t-sb-text);font-size:12px;padding:0}
.mg .h{color:var(--t-sb-muted);font-weight:700}
.mg .o{opacity:.45}
.mg .t{background:var(--t-sb-cur-bg);color:var(--t-sb-cur-text);font-weight:700}
.mg .sel{box-shadow:inset 0 0 0 2px var(--t-sb-cur-bg)}
.mg .m::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--t-per)}
.side-foot{font-size:12px;color:var(--t-sb-muted);padding:0 10px}

/* ── 본문 ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;padding:22px 26px;overflow:auto}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--t-accent)}
.hd .ttl{flex:1;min-width:180px}
.hd small{color:var(--t-muted);font-size:14px}
.hd h1{font-size:26px;color:var(--t-title);text-wrap:balance}
.menu-btn{display:none;width:44px;height:44px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);place-items:center}
.btn{min-height:42px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:4px;background:var(--t-accent);color:var(--t-on-accent);font-weight:700;white-space:nowrap}
.btn[disabled]{opacity:.6;cursor:wait}
.ghost{min-height:42px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);color:var(--t-text);font-weight:500;white-space:nowrap}
.danger{color:#b3261e;border-color:#e6b8b4}
.arw{width:42px;height:42px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);color:var(--t-text);display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;width:280px;max-width:100%;min-height:42px;padding:0 12px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);color:var(--t-muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px;color:var(--t-text)}
.segv{display:flex;border:1px solid var(--t-line);border-radius:4px;overflow:hidden;background:var(--t-surface)}
.segv button{min-height:40px;padding:0 14px;border:0;border-right:1px solid var(--t-line);background:none;color:var(--t-text);font-size:14px}
.segv button:last-child{border-right:0}
.segv .on{background:var(--t-accent);color:var(--t-on-accent);font-weight:700}
.card{background:var(--t-surface);border:1px solid var(--t-line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-size:15px;color:var(--t-title);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-size:12px;font-weight:400;color:var(--t-muted)}
.empty{color:var(--t-muted);font-size:14px;padding:6px 0}
.lb{font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px;border:1px solid;background:var(--t-surface);white-space:nowrap}
.lw{color:var(--t-work-ink);border-color:var(--t-work)}.lp{color:var(--t-per-ink);border-color:var(--t-per)}
.tg{font-size:12px;padding:1px 8px;border-radius:3px;white-space:nowrap}
.tw{background:var(--t-work-soft);color:var(--t-work-ink)}.tp{background:var(--t-per-soft);color:var(--t-per-ink)}

/* 대시보드 */
.dash{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.col1,.col2{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.col1>.tkcard{flex:1;min-height:460px}
.col2>.today{flex:1;min-height:380px}
.sub2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.sub2 .recs{max-height:178px;overflow:auto}
/* 할 일 작업 공간: 왼쪽 목록 + 오른쪽 문서 편집기 */
.tws{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}
.tklist{display:flex;flex-direction:column;gap:4px;min-height:0;border-right:1px solid var(--t-line);padding-right:10px}
.tklist .addrow select{display:none}
.tkrow .x{display:none;width:28px;height:28px}
.tkrow.on .x{display:grid}
.tkrow .ws{flex:none;width:4px;height:18px;border-radius:2px;background:var(--t-work)}
.tkrow .ws.p{background:var(--t-per)}
.tkitems{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.tkrow{border-radius:4px;padding:0 2px 0 6px;gap:8px}
.tkrow.on{background:var(--t-accent-soft,var(--t-surface2));box-shadow:inset 3px 0 0 var(--t-accent)}
.tkname{flex:1;min-width:0;min-height:38px;border:0;background:none;color:inherit;text-align:left;font-size:14px;display:flex;align-items:center;gap:6px;padding:0}
.tkname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkname small{flex:none}
.task.done .tkname{color:var(--t-muted);text-decoration:line-through}
.tkname .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--t-accent);opacity:.55}
.ted{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.tkt{width:100%;border:0;border-bottom:1px solid var(--t-line);background:none;color:var(--t-title);font-size:20px;font-weight:700;padding:4px 0 8px}
.tkt:focus{outline:none;border-bottom-color:var(--t-accent)}
.tkmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:13px;color:var(--t-muted)}
.tkmeta label{display:flex;align-items:center;gap:6px}
.tkmeta select,.tkmeta input[type=date]{min-height:34px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);color:var(--t-text);padding:0 6px;font-size:13px}
.tkmeta input[type=checkbox]{width:18px;height:18px;accent-color:var(--t-accent)}
.tkmeta .saved{margin-left:auto;white-space:nowrap}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface2);position:relative}
.tbar select{height:32px;border:1px solid var(--t-line);border-radius:3px;background:var(--t-surface);color:var(--t-text);font-size:13px;padding:0 4px;margin-right:2px}
.tbar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tbar button{min-width:30px;height:32px;padding:0 6px;border:0;border-radius:3px;background:none;color:var(--t-text);font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbar button:hover,.tbar button.on{background:var(--t-surface)}
.tbar .sep{width:1px;height:20px;background:var(--t-line);margin:0 3px}
.tbar .pal{position:absolute;top:100%;margin-top:4px;z-index:5;display:flex;gap:4px;padding:6px;background:var(--t-surface);border:1px solid var(--t-line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.tbar .pal button{width:28px;min-width:28px;height:28px;border:1px solid var(--t-line);padding:0}
.doc{flex:1;min-height:180px;overflow:auto;border:1px solid var(--t-line);border-radius:4px;padding:18px 22px;background:var(--t-surface);color:var(--t-text);font-size:15px;line-height:1.75;outline:none;overflow-wrap:anywhere}
.doc:focus{border-color:var(--t-accent)}
.doc:empty::before{content:attr(data-ph);color:var(--t-muted)}
.doc h1{font-size:22px;margin:.6em 0 .3em;color:var(--t-title)}
.doc h2{font-size:18px;margin:.6em 0 .3em;color:var(--t-title)}
.doc h3{font-size:16px;margin:.5em 0 .2em}
.doc p,.doc div{margin:0}
.doc ul,.doc ol{margin:.3em 0;padding-left:1.6em}
.doc blockquote{margin:.5em 0;padding:4px 14px;border-left:3px solid var(--t-line);color:var(--t-muted)}
.doc hr{border:0;border-top:1px solid var(--t-line);margin:12px 0}
.doc table{border-collapse:collapse;margin:8px 0;width:100%}
.doc td,.doc th{border:1px solid var(--t-line);padding:6px 8px;vertical-align:top;min-width:60px}
.doc th{background:var(--t-surface2)}
.tkempty{flex:1;display:grid;place-items:center;text-align:center;color:var(--t-muted);font-size:14px;border:1px dashed var(--t-line);border-radius:4px;padding:24px}
.allday{display:flex;flex-wrap:wrap;gap:6px}
.allday button{border:0;border-radius:4px;padding:4px 10px;font-size:13px}
.tlwrap{flex:1;min-height:320px;overflow:auto;position:relative}
.tl{position:relative;padding-left:56px;margin-top:10px}
.hr{height:var(--hour);border-top:1px dashed var(--t-line);position:relative}
.hr span{position:absolute;left:-56px;top:-9px;width:46px;text-align:right;font-size:12px;color:var(--t-muted)}
.tl .slot{position:absolute;left:56px;right:0;top:0;bottom:0}
.blk{position:absolute;border:0;border-radius:5px;padding:6px 10px;font-size:14px;display:flex;align-items:flex-start;gap:10px;overflow:hidden;text-align:left;border-top:3px solid}
.blk div{flex:1;min-width:0}
.blk small{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw{background:var(--t-work-soft);color:var(--t-work-ink);border-color:var(--t-work)}
.bp{background:var(--t-per-soft);color:var(--t-per-ink);border-color:var(--t-per)}
.now{position:absolute;left:48px;right:0;border-top:2px solid var(--t-per);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--t-per)}
.task{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px}
.task input{width:20px;height:20px;accent-color:var(--t-accent);flex:none}
.task label{flex:1;display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer}
.task.done label{color:var(--t-muted);text-decoration:line-through}
.task .x{width:32px;height:32px;border:0;background:none;color:var(--t-muted);border-radius:4px;display:grid;place-items:center}
.task small{color:var(--t-muted);font-size:12px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1;min-width:0;min-height:40px;border:1px solid var(--t-line);border-radius:4px;padding:0 10px;background:var(--t-surface);font-size:14px}
.addrow select{min-height:40px;border:1px solid var(--t-line);border-radius:4px;background:var(--t-surface);padding:0 6px;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--t-line);border-radius:4px;padding:6px 0;font-size:12px;color:var(--t-muted);display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--t-surface)}
.day b{font-size:14px;color:var(--t-text)}
.day.today{background:var(--t-accent);border-color:var(--t-accent);color:var(--t-on-accent)}
.day.today b{color:var(--t-on-accent)}
.day.sel{box-shadow:inset 0 0 0 2px var(--t-accent)}
.day i{display:flex;gap:2px;height:5px}
.day i span{width:5px;height:5px;border-radius:50%}
.day .w{background:var(--t-work)}.day .p{background:var(--t-per)}
.day.today i span{background:var(--t-on-accent)}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:6px 0;border:0;border-bottom:1px solid var(--t-line);background:none;width:100%;text-align:left}
.rec:last-child{border-bottom:0}
.rec span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{flex:1;min-height:110px;resize:vertical;border:1px solid var(--t-line);border-radius:4px;padding:8px 10px;font-size:14px;line-height:26px;background:var(--t-surface2);color:var(--t-text)}
.saved{font-size:12px;color:var(--t-muted)}

/* 주간 */
.wk{flex:1;min-height:420px;background:var(--t-surface);border:1px solid var(--t-line);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.wk-scroll{flex:1;overflow:auto}
.wk-in{min-width:760px}
.wkh{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--t-line);position:sticky;top:0;background:var(--t-surface);z-index:3}
.wkh>div{min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--t-muted)}
.wkh b{color:var(--t-text);padding:2px 8px;border-radius:999px}
.wkh .today b{background:var(--t-accent);color:var(--t-on-accent)}
.wkh .hol,.wkh .hol b{color:#b3261e}
.wka{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--t-line);min-height:30px;position:sticky;top:45px;background:var(--t-surface);z-index:3}
.wka>div{border-left:1px solid var(--t-line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wka>div:first-child{border:0;font-size:11px;color:var(--t-muted);align-items:flex-end;justify-content:center;padding-right:8px}
.chip{display:block;width:100%;border:0;border-radius:3px;padding:2px 6px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.w{background:var(--t-work-soft);color:var(--t-work-ink)}.chip.p{background:var(--t-per-soft);color:var(--t-per-ink)}
.chip.h{background:none;color:#b3261e;font-weight:700;padding-left:0}
.wkb{display:grid;grid-template-columns:56px repeat(7,1fr);background-image:repeating-linear-gradient(to bottom,var(--t-line) 0 1px,transparent 1px var(--hour))}
.times div{height:var(--hour);font-size:12px;color:var(--t-muted);text-align:right;padding:3px 8px 0 0}
.col{position:relative;border-left:1px solid var(--t-line);cursor:copy}
.col.today{background:var(--t-surface2)}
.ev{position:absolute;border:0;border-radius:4px;padding:3px 6px;font-size:12px;line-height:1.35;overflow:hidden;text-align:left;border-top:3px solid;z-index:1}
.ev b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.w{background:var(--t-work-soft);color:var(--t-work-ink);border-color:var(--t-work)}
.ev.p{background:var(--t-per-soft);color:var(--t-per-ink);border-color:var(--t-per)}
.nowl{position:absolute;left:0;right:0;border-top:2px solid var(--t-per);z-index:2;pointer-events:none}

/* 월간 */
.mo{flex:1;min-height:480px;display:grid;grid-template-rows:36px;grid-auto-rows:1fr;background:var(--t-surface);border:1px solid var(--t-line);border-radius:6px;overflow:hidden}
.mo .r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0}
.mo .h div{font-size:13px;font-weight:700;color:var(--t-muted);padding:8px 10px;border-bottom:1px solid var(--t-line)}
.mo .h div:last-child{color:#b3261e}
.mo .c{border:0;border-right:1px solid var(--t-line);border-bottom:1px solid var(--t-line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;background:none;text-align:left;cursor:pointer}
.mo .c:last-child{border-right:0}
.mo .r:last-child .c{border-bottom:0}
.mo .c.out{background:var(--t-surface2);color:var(--t-muted)}
.mo .c.today{background:var(--t-surface2)}
.mo .n{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:700}
.mo .today .n{background:var(--t-accent);color:var(--t-on-accent)}
.mo .hol .n,.mo .sun .n{color:#b3261e}
.mo .today.hol .n,.mo .today.sun .n{color:var(--t-on-accent)}
.mo .more{font-size:12px;color:var(--t-muted);padding-left:4px}

/* 데이터베이스 */
.dbw{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.tblc{padding:0;overflow:auto;min-height:240px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--t-muted);padding:11px 14px;border-bottom:2px solid var(--t-accent);background:var(--t-surface2);white-space:nowrap;position:sticky;top:0}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.st-row:last-child{border-bottom:0}

.help{font-size:13px;color:var(--t-muted);line-height:1.6}
.dbl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--t-line);font-size:14px}

.dlg .f input:not([type=checkbox]),.dlg .f select{min-height:40px}

<script>
(function () {
  var KEY = 'mybase-demo-v1';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
  var sheetRows = saved.sheets || {};   // 시트 이름 → 행 배열
  var props = saved.props || {};
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ sheets: sheetRows, props: props })); } catch (e) {}
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function seoulParts(date) {
    var o = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
    return o;
  }
  function makeSheet(name) {
    if (!sheetRows[name]) sheetRows[name] = [];
    var rows = sheetRows[name];
    return {
      getName: function () { return name; },
      getLastRow: function () { return rows.length; },
      getRange: function (r, c, nr, nc) {
        nr = nr || 1; nc = nc || 1;
        return {
          getValues: function () {
            return rows.slice(r - 1, r - 1 + nr).map(function (row) {
              var out = []; for (var j = 0; j < nc; j++) { var v = row[c - 1 + j]; out.push(v == null ? '' : v); } return out;
            });
          },
          getValue: function () { var v = (rows[r - 1] || [])[c - 1]; return v == null ? '' : v; },
          setValues: function (vals) {
            vals.forEach(function (v, i) { rows[r - 1 + i] = rows[r - 1 + i] || []; v.forEach(function (x, j) { rows[r - 1 + i][c - 1 + j] = x; }); });
            return this;
          },
          setFontWeight: function () { return this; },
        };
      },
      appendRow: function (v) { rows.push(v.slice()); },
      deleteRow: function (r) { rows.splice(r - 1, 1); },
      setFrozenRows: function () {},
    };
  }
  var ss = {
    getId: function () { return 'demo-sheet'; },
    getUrl: function () { return '#'; },
    getSheetByName: function (n) { return sheetRows[n] ? makeSheet(n) : null; },
    insertSheet: function (n) { sheetRows[n] = []; return makeSheet(n); },
    getSheets: function () { return Object.keys(sheetRows).map(makeSheet); },
    deleteSheet: function (s) { delete sheetRows[s.getName()]; },
  };
  function fakeEvent() {
    var id = 'demo-' + uuid();
    return { getId: function () { return id; }, removeAllReminders: function () {}, addPopupReminder: function () {},
      deleteEvent: function () {}, deleteEventSeries: function () {} };
  }
  var cal = {
    getId: function () { return 'demo@calendar'; }, getName: function () { return '체험판 캘린더 (실제로 기록되지 않음)'; },
    createEvent: fakeEvent, createEventSeries: fakeEvent, createAllDayEvent: fakeEvent, createAllDayEventSeries: fakeEvent,
    getEventById: function () { return fakeEvent(); }, getEventSeriesById: function () { return fakeEvent(); },
  };
  function rec() { return { addDailyRule: function () { return this; }, addWeeklyRule: function () { return this; }, addMonthlyRule: function () { return this; } }; }

  var GAS = {
    PropertiesService: { getScriptProperties: function () { return {
      getProperty: function (k) { return props[k] == null ? null : props[k]; },
      setProperty: function (k, v) { props[k] = v; } }; } },
    SpreadsheetApp: { create: function () { return ss; }, openById: function () { return ss; } },
    LockService: { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } },
    Session: { getScriptTimeZone: function () { return 'Asia/Seoul'; } },
    Logger: { log: function () { console.log.apply(console, arguments); } },
    HtmlService: {},
    CalendarApp: { getDefaultCalendar: function () { return cal; }, getCalendarById: function () { return cal; }, newRecurrence: rec },
    UrlFetchApp: { fetch: function () { return { getResponseCode: function () { return 204; }, getContentText: function () { return ''; } }; } },
    Utilities: {
      getUuid: uuid,
      base64Encode: function (s) { return btoa(unescape(encodeURIComponent(s))); },
      Charset: { UTF_8: 'UTF-8' },
      newBlob: function (s) { return { getBytes: function () { return Array.from(new TextEncoder().encode(s)); } }; },
      formatDate: function (date, tz, fmt) {
        var o = seoulParts(date);
        return fmt.replace('yyyy', o.year).replace('MM', o.month).replace('dd', o.day).replace('HH', o.hour).replace('mm', o.minute);
      },
      parseDate: function (str) {
        var m = str.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?$/);
        if (!m) throw new Error('parseDate: ' + str);
        return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], (+m[4] || 0) - 9, +m[5] || 0));
      },
    },
  };

  var serverApi = (function (PropertiesService, SpreadsheetApp, LockService, Session, Logger, HtmlService, CalendarApp, UrlFetchApp, Utilities) {
/**
 * 데이터 저장소: 구글 스프레드시트 한 개에 컬렉션마다 시트 하나.
 * 각 행은 [id, 제목, 구분, 수정 시각, data(JSON)] 이고, 객체 전체는 data 열에 JSON으로 들어간다.
 * 앞의 네 열은 시트를 직접 열었을 때 알아보기 쉽게 하려는 사본이다.
 */

const COLLECTIONS = ['events', 'tasks', 'databases', 'records', 'memos'];
const SHEET_TITLES = { events: '일정', tasks: '할 일', databases: '데이터베이스', records: '기록', memos: '메모' };
const HEADERS = ['id', '제목', '구분', '수정 시각', 'data'];

let spreadsheet_ = null;

function props_() {
  return PropertiesService.getScriptProperties();
}

/** 저장용 스프레드시트를 연다. 없으면 내 드라이브에 새로 만든다. */
function spreadsheet() {
  if (spreadsheet_) return spreadsheet_;
  const id = props_().getProperty('SHEET_ID');
  if (id) {
    spreadsheet_ = SpreadsheetApp.openById(id);
  } else {
    spreadsheet_ = SpreadsheetApp.create('My Base 데이터');
    props_().setProperty('SHEET_ID', spreadsheet_.getId());
  }
  return spreadsheet_;
}

function sheet_(name) {
  const ss = spreadsheet();
  const title = SHEET_TITLES[name];
  let sh = ss.getSheetByName(title);
  if (!sh) {
    sh = ss.insertSheet(title);
    sh.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]).setFontWeight('bold');
    sh.setFrozenRows(1);
    // 새 스프레드시트의 빈 기본 시트는 정리한다.
    const blank = ss.getSheetByName('Sheet1') || ss.getSheetByName('시트1');
    if (blank && ss.getSheets().length > 1 && blank.getLastRow() === 0) ss.deleteSheet(blank);
  }
  return sh;
}

function readAll(name) {
  const sh = sheet_(name);
  const last = sh.getLastRow();
  if (last < 2) return [];
  return sh.getRange(2, 5, last - 1, 1).getValues()
    .map(function (r) { return r[0] ? JSON.parse(r[0]) : null; })
    .filter(Boolean);
}

function findRow_(sh, id) {
  const last = sh.getLastRow();
  if (last < 2) return -1;
  const ids = sh.getRange(2, 1, last - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    if (ids[i][0] === id) return i + 2;
  }
  return -1;
}

function rowOf_(obj) {
  return [obj.id, obj.title || obj.name || '', obj.workspace || '', obj.updatedAt || '', JSON.stringify(obj)];
}

/** id가 같으면 덮어쓰고, 없으면 새 행으로 추가한다. */
function upsert(name, obj) {
  if (!obj.id) obj.id = Utilities.getUuid();
  obj.updatedAt = new Date().toISOString();
  const sh = sheet_(name);
  const row = findRow_(sh, obj.id);
  if (row > 0) sh.getRange(row, 1, 1, HEADERS.length).setValues([rowOf_(obj)]);
  else sh.appendRow(rowOf_(obj));
  return obj;
}

function getById(name, id) {
  const sh = sheet_(name);
  const row = findRow_(sh, id);
  if (row < 0) return null;
  return JSON.parse(sh.getRange(row, 5).getValue());
}

function remove(name, id) {
  const sh = sheet_(name);
  const row = findRow_(sh, id);
  if (row > 0) sh.deleteRow(row);
}

/** 여러 요청이 동시에 시트를 고치지 않도록 잠근 채로 실행한다. */
function withLock(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    return fn();
  } finally {
    lock.releaseLock();
  }
}

;
/**
 * iCloud 캘린더(CalDAV) 연동.
 * 일정 하나를 .ics 파일로 만들어 캘린더 주소 아래에 PUT 하면 iCloud에 저장되고, DELETE 하면 지워진다.
 *
 * 스크립트 속성:
 *   ICLOUD_USER, ICLOUD_APP_PASSWORD   Apple ID 와 앱 전용 암호
 *   ICLOUD_CALENDAR_URL                기본 캘린더 주소 (tools/find_icloud_calendar.py 로 찾음)
 *   ICLOUD_CALENDAR_URL_WORK / _PERSONAL  (선택) 업무·개인을 다른 iCloud 캘린더에 넣고 싶을 때
 */

function iCloudConfig(workspace) {
  const p = props_();
  const user = p.getProperty('ICLOUD_USER');
  const password = p.getProperty('ICLOUD_APP_PASSWORD');
  const key = workspace === 'work' ? 'ICLOUD_CALENDAR_URL_WORK' : 'ICLOUD_CALENDAR_URL_PERSONAL';
  let url = p.getProperty(key) || p.getProperty('ICLOUD_CALENDAR_URL');
  if (!user || !password || !url) return null;
  url = url.trim();
  if (!url.endsWith('/')) url += '/';
  return { user: user.trim(), password: password.trim(), calendarUrl: url };
}

function iCloudRequest_(config, url, options) {
  options.headers = Object.assign({}, options.headers, {
    Authorization: 'Basic ' + Utilities.base64Encode(config.user + ':' + config.password, Utilities.Charset.UTF_8),
  });
  options.muteHttpExceptions = true;
  return UrlFetchApp.fetch(url, options).getResponseCode();
}

/** 새로 만들거나(existingUrl 없음) 같은 주소에 덮어쓴다. 저장한 .ics 주소를 돌려준다. */
function iCloudPut(ev, existingUrl) {
  const config = iCloudConfig(ev.workspace);
  if (!config) throw new Error('iCloud 설정이 없습니다');
  const uid = ev.id;
  const url = existingUrl || config.calendarUrl + uid + '.ics';
  const headers = existingUrl ? {} : { 'If-None-Match': '*' };
  const code = iCloudRequest_(config, url, {
    method: 'put',
    contentType: 'text/calendar; charset=utf-8',
    payload: Utilities.newBlob(buildIcs_(ev, uid, new Date())).getBytes(),
    headers: headers,
  });
  if (code !== 201 && code !== 204) throw new Error(describeICloudError_(code));
  return url;
}

function iCloudDelete(workspace, url) {
  const config = iCloudConfig(workspace);
  if (!config) return;
  const code = iCloudRequest_(config, url, { method: 'delete' });
  // 이미 지워진 일정(404)은 성공으로 본다.
  if (code !== 200 && code !== 204 && code !== 404) throw new Error(describeICloudError_(code));
}

function describeICloudError_(code) {
  if (code === 401) return 'iCloud 인증 실패 (Apple ID 또는 앱 전용 암호 확인)';
  if (code === 403 || code === 404) return 'iCloud 캘린더 주소를 확인하세요 (HTTP ' + code + ')';
  if (code === 412) return '같은 일정이 iCloud에 이미 있습니다 (HTTP 412)';
  return 'iCloud 저장 실패 (HTTP ' + code + ')';
}

// ---- 아래는 순수 함수 (iCalendar 텍스트 생성) — tests/ 에서 Node 로 검사한다 ----

/**
 * ev: { title, location, memo, allDay, date, endDate, start, end, repeat, reminder }
 * 시간은 서울 시간(UTC+9, 서머타임 없음) 기준 문자열이다.
 */
function buildIcs_(ev, uid, now) {
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//My Base//Schedule//KO',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + toIcsUtc_(now),
  ];
  if (ev.allDay) {
    lines.push('DTSTART;VALUE=DATE:' + ev.date.replace(/-/g, ''));
    lines.push('DTEND;VALUE=DATE:' + nextDay_(ev.endDate || ev.date).replace(/-/g, ''));
  } else {
    lines.push('DTSTART:' + toIcsUtc_(seoulToDate_(ev.date, ev.start)));
    lines.push('DTEND:' + toIcsUtc_(seoulToDate_(ev.date, ev.end)));
  }
  const rrule = { daily: 'DAILY', weekly: 'WEEKLY', monthly: 'MONTHLY' }[ev.repeat];
  if (rrule) lines.push('RRULE:FREQ=' + rrule);
  lines.push('SUMMARY:' + escapeIcsText_(ev.title));
  if (ev.location) lines.push('LOCATION:' + escapeIcsText_(ev.location));
  if (ev.memo) lines.push('DESCRIPTION:' + escapeIcsText_(ev.memo));
  if (ev.reminder !== null && ev.reminder !== undefined && ev.reminder !== '') {
    lines.push(
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + escapeIcsText_(ev.title),
      'TRIGGER:' + toIcsTrigger_(Number(ev.reminder)),
      'END:VALARM'
    );
  }
  lines.push('END:VEVENT', 'END:VCALENDAR');
  return lines.map(foldIcsLine_).join('\r\n') + '\r\n';
}

/** '2026-10-30', '14:00' (서울) → Date */
function seoulToDate_(ymd, hm) {
  const d = ymd.split('-').map(Number);
  const t = hm.split(':').map(Number);
  return new Date(Date.UTC(d[0], d[1] - 1, d[2], t[0] - 9, t[1]));
}

/** Date → 20261030T050000Z */
function toIcsUtc_(date) {
  return date.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
}

/** '2026-10-31' → '2026-11-01' */
function nextDay_(ymd) {
  const p = ymd.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + 1)).toISOString().slice(0, 10);
}

function toIcsTrigger_(minutes) {
  if (minutes === 0) return 'PT0S';
  if (minutes % 1440 === 0) return '-P' + minutes / 1440 + 'D';
  return '-PT' + minutes + 'M';
}

function escapeIcsText_(text) {
  return String(text)
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');
}

/** RFC 5545: 한 줄은 75바이트(UTF-8)를 넘지 않게 접는다. 한글이 중간에 잘리지 않도록 글자 단위로 센다. */
function foldIcsLine_(line) {
  const parts = [];
  let current = '';
  let bytes = 0;
  for (const ch of line) {
    const cp = ch.codePointAt(0);
    const size = cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
    const limit = parts.length === 0 ? 75 : 74; // 이어지는 줄은 앞의 공백 1바이트 포함
    if (bytes + size > limit) {
      parts.push(current);
      current = '';
      bytes = 0;
    }
    current += ch;
    bytes += size;
  }
  parts.push(current);
  return parts.join('\r\n ');
}

;
/**
 * Google 캘린더 연동.
 * 스크립트 속성 (모두 선택):
 *   GOOGLE_CALENDAR_ID_WORK / GOOGLE_CALENDAR_ID_PERSONAL  업무·개인을 다른 캘린더에 넣고 싶을 때
 *   GOOGLE_CALENDAR_ID                                     공통 캘린더 (비우면 기본 캘린더)
 */

function googleCalendar(workspace) {
  const p = props_();
  const key = workspace === 'work' ? 'GOOGLE_CALENDAR_ID_WORK' : 'GOOGLE_CALENDAR_ID_PERSONAL';
  const id = p.getProperty(key) || p.getProperty('GOOGLE_CALENDAR_ID');
  const cal = id ? CalendarApp.getCalendarById(id) : CalendarApp.getDefaultCalendar();
  if (!cal) throw new Error('구글 캘린더를 찾을 수 없습니다: ' + id);
  return cal;
}

function recurrence_(repeat) {
  if (repeat === 'daily') return CalendarApp.newRecurrence().addDailyRule();
  // 주간·월간 규칙은 시작일의 요일·날짜를 따라 반복된다.
  if (repeat === 'weekly') return CalendarApp.newRecurrence().addWeeklyRule();
  if (repeat === 'monthly') return CalendarApp.newRecurrence().addMonthlyRule();
  return null;
}

/** 일정을 만들고, 나중에 지울 때 필요한 정보를 돌려준다. */
function googleCreate(ev) {
  const cal = googleCalendar(ev.workspace);
  const tz = Session.getScriptTimeZone();
  const opts = { location: ev.location || '', description: ev.memo || '' };
  const rec = recurrence_(ev.repeat);
  let item;
  if (ev.allDay) {
    const start = Utilities.parseDate(ev.date, tz, 'yyyy-MM-dd');
    if (rec) {
      item = cal.createAllDayEventSeries(ev.title, start, rec, opts);
    } else {
      // 종일 일정의 종료일은 '다음 날'(배타적)이다.
      const end = Utilities.parseDate(nextDay_(ev.endDate || ev.date), tz, 'yyyy-MM-dd');
      item = cal.createAllDayEvent(ev.title, start, end, opts);
    }
  } else {
    const s = Utilities.parseDate(ev.date + ' ' + ev.start, tz, 'yyyy-MM-dd HH:mm');
    const e = Utilities.parseDate(ev.date + ' ' + ev.end, tz, 'yyyy-MM-dd HH:mm');
    item = rec ? cal.createEventSeries(ev.title, s, e, rec, opts) : cal.createEvent(ev.title, s, e, opts);
  }
  // 앱과 iCloud 쪽 알림과 같게 맞추려고 캘린더 기본 알림은 지운다.
  item.removeAllReminders();
  if (ev.reminder !== null) item.addPopupReminder(ev.reminder);
  return { id: item.getId(), calId: cal.getId(), series: !!rec };
}

function googleDelete(g) {
  const cal = CalendarApp.getCalendarById(g.calId);
  if (!cal) return;
  if (g.series) {
    const series = cal.getEventSeriesById(g.id);
    if (series) series.deleteEventSeries();
  } else {
    const event = cal.getEventById(g.id);
    if (event) event.deleteEvent();
  }
}

;
/**
 * My Base — 개인 DB & 일정 관리 웹앱의 진입점.
 * 화면(Index.html)은 google.script.run.api(action, payload) 하나로 서버를 부른다.
 */

function doGet() {
  return HtmlService.createHtmlOutputFromFile('Index')
    .setTitle('My Base')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover');
}

function api(action, payload) {
  const handlers = {
    bootstrap: bootstrap,
    saveEvent: saveEvent,
    deleteEvent: deleteEvent,
    saveTask: saveTask,
    deleteTask: deleteTask,
    saveDatabase: saveDatabase,
    deleteDatabase: deleteDatabase,
    saveRecord: saveRecord,
    deleteRecord: deleteRecord,
    saveMemo: saveMemo,
    saveSettings: saveSettings,
  };
  const fn = handlers[action];
  if (!fn) throw new Error('알 수 없는 요청입니다: ' + action);
  return fn(payload || {});
}

// ---------- 처음 화면 ----------

function bootstrap() {
  return withLock(function () {
    seedDatabases_();
    const tz = Session.getScriptTimeZone();
    const now = new Date();
    const memo = getById('memos', 'quick');
    return {
      today: Utilities.formatDate(now, tz, 'yyyy-MM-dd'),
      now: Utilities.formatDate(now, tz, 'HH:mm'),
      settings: { theme: props_().getProperty('THEME') || 'posco-white' },
      status: status_(),
      events: readAll('events'),
      tasks: readAll('tasks'),
      databases: readAll('databases'),
      records: readAll('records'),
      memo: memo ? memo.text : '',
      sheetUrl: spreadsheet().getUrl(),
    };
  });
}

function status_() {
  function calName(ws) {
    try { return googleCalendar(ws).getName(); } catch (e) { return null; }
  }
  return {
    google: { work: calName('work'), personal: calName('personal') },
    apple: { work: !!iCloudConfig('work'), personal: !!iCloudConfig('personal') },
  };
}

/** 데이터베이스가 하나도 없으면 기본 DB 6개를 만든다 (기록은 비어 있음). */
function seedDatabases_() {
  if (readAll('databases').length) return;
  const seeds = [
    ['work', '프로젝트', [['상태', 'select', ['대기', '진행 중', '완료']], ['거래처', 'text'], ['마감일', 'date'], ['태그', 'text']]],
    ['work', '거래처·연락처', [['회사', 'text'], ['담당자', 'text'], ['전화', 'text'], ['이메일', 'text']]],
    ['work', '회의록', [['날짜', 'date'], ['참석자', 'text']]],
    ['personal', '연락처', [['관계', 'text'], ['전화', 'text'], ['생일', 'date']]],
    ['personal', '가계부', [['날짜', 'date'], ['구분', 'select', ['지출', '수입']], ['금액', 'number'], ['분류', 'text']]],
    ['personal', '메모·기록', [['태그', 'text']]],
  ];
  seeds.forEach(function (s, i) {
    upsert('databases', {
      name: s[1],
      workspace: s[0],
      order: i,
      fields: s[2].map(function (f, j) { return { id: 'f' + (j + 1), name: f[0], type: f[1], options: f[2] || [] }; }),
    });
  });
}

// ---------- 입력값 검사 ----------

const WORKSPACES = ['work', 'personal'];
const REPEATS = ['none', 'daily', 'weekly', 'monthly'];
const REMINDERS = [0, 10, 30, 60, 1440];
const FIELD_TYPES = ['text', 'number', 'date', 'select', 'check'];
const YMD = /^\d{4}-\d{2}-\d{2}$/;
const HM = /^\d{2}:\d{2}$/;

function text_(v, max, label) {
  const s = String(v == null ? '' : v).trim();
  if (s.length > max) throw new Error(label + '은(는) ' + max + '자 이하로 입력하세요.');
  return s;
}

function cleanEvent_(input) {
  const ev = {
    id: input.id ? String(input.id) : '',
    title: text_(input.title, 200, '제목'),
    workspace: WORKSPACES.indexOf(input.workspace) >= 0 ? input.workspace : 'work',
    allDay: !!input.allDay,
    date: String(input.date || ''),
    endDate: String(input.endDate || input.date || ''),
    start: String(input.start || ''),
    end: String(input.end || ''),
    repeat: REPEATS.indexOf(input.repeat) >= 0 ? input.repeat : 'none',
    reminder: input.reminder === '' || input.reminder == null ? null : Number(input.reminder),
    location: text_(input.location, 200, '장소'),
    memo: text_(input.memo, 5000, '메모'),
    recordId: input.recordId ? String(input.recordId) : '',
    toGoogle: !!input.toGoogle,
    toApple: !!input.toApple,
  };
  if (!ev.title) throw new Error('제목을 입력하세요.');
  if (!YMD.test(ev.date) || !YMD.test(ev.endDate)) throw new Error('날짜 형식이 올바르지 않습니다.');
  if (ev.reminder !== null && REMINDERS.indexOf(ev.reminder) < 0) throw new Error('알림 값이 올바르지 않습니다.');
  if (ev.allDay) {
    if (ev.endDate < ev.date) throw new Error('종료일이 시작일보다 빠릅니다.');
    if (ev.repeat !== 'none') ev.endDate = ev.date; // 반복하는 종일 일정은 하루짜리만 지원
    ev.start = '';
    ev.end = '';
  } else {
    if (!HM.test(ev.start) || !HM.test(ev.end)) throw new Error('시간 형식이 올바르지 않습니다.');
    if (ev.end <= ev.start) throw new Error('종료 시간이 시작 시간보다 늦어야 합니다.');
    ev.endDate = ev.date;
  }
  return ev;
}

// ---------- 일정 ----------

/**
 * 일정을 시트에 저장하고, 고른 외부 캘린더에도 기록한다.
 * 외부 캘린더가 실패해도 앱에는 저장하고, 실패 이유를 ev.sync 에 남긴다.
 */
function saveEvent(input) {
  const ev = cleanEvent_(input);
  return withLock(function () {
    const old = ev.id ? getById('events', ev.id) : null;
    if (!ev.id) ev.id = Utilities.getUuid();
    if (old) ev.createdAt = old.createdAt;
    else ev.createdAt = new Date().toISOString();
    ev.google = null;
    ev.apple = null;
    ev.sync = {};

    // Google: 바뀐 내용을 정확히 반영하려고 이전 사본을 지우고 새로 만든다.
    if (old && old.google) {
      try { googleDelete(old.google); } catch (e) { ev.sync.google = '이전 Google 일정을 지우지 못했습니다: ' + e.message; }
    }
    if (ev.toGoogle) {
      try { ev.google = googleCreate(ev); ev.sync.google = 'ok'; } catch (e) { ev.sync.google = e.message; }
    }

    // iCloud: 같은 캘린더면 같은 주소에 덮어쓰고, 아니면 이전 사본을 지운다.
    const keepUrl = old && old.apple && ev.toApple && old.workspace === ev.workspace ? old.apple.url : null;
    if (old && old.apple && !keepUrl) {
      try { iCloudDelete(old.workspace, old.apple.url); } catch (e) { ev.sync.apple = '이전 iCloud 일정을 지우지 못했습니다: ' + e.message; }
    }
    if (ev.toApple) {
      try { ev.apple = { url: iCloudPut(ev, keepUrl) }; ev.sync.apple = 'ok'; } catch (e) { ev.sync.apple = e.message; }
    }

    return upsert('events', ev);
  });
}

function deleteEvent(input) {
  return withLock(function () {
    const old = getById('events', String(input.id));
    if (!old) return { ok: true, warnings: [] };
    const warnings = [];
    if (old.google) {
      try { googleDelete(old.google); } catch (e) { warnings.push('Google: ' + e.message); }
    }
    if (old.apple) {
      try { iCloudDelete(old.workspace, old.apple.url); } catch (e) { warnings.push('iCloud: ' + e.message); }
    }
    remove('events', old.id);
    return { ok: true, warnings: warnings };
  });
}

// ---------- 할 일 ----------

function saveTask(input) {
  const task = {
    id: input.id ? String(input.id) : '',
    title: text_(input.title, 200, '할 일'),
    workspace: WORKSPACES.indexOf(input.workspace) >= 0 ? input.workspace : 'work',
    done: !!input.done,
    due: YMD.test(input.due || '') ? input.due : '',
    detail: String(input.detail == null ? '' : input.detail),
    createdAt: input.createdAt || new Date().toISOString(),
  };
  if (!task.title) throw new Error('할 일을 입력하세요.');
  // 시트 한 칸에는 5만 자까지만 들어가므로, 서식까지 포함한 상세 내용을 4만 자로 제한한다.
  if (JSON.stringify(task.detail).length > 40000) {
    throw new Error('상세 내용이 너무 깁니다. 일부를 줄이거나 나눠서 적어 주세요.');
  }
  return withLock(function () { return upsert('tasks', task); });
}

function deleteTask(input) {
  return withLock(function () { remove('tasks', String(input.id)); return { ok: true }; });
}

// ---------- 데이터베이스 ----------

function saveDatabase(input) {
  const db = {
    id: input.id ? String(input.id) : '',
    name: text_(input.name, 60, 'DB 이름'),
    workspace: WORKSPACES.indexOf(input.workspace) >= 0 ? input.workspace : 'work',
    order: Number(input.order) || 0,
    fields: (input.fields || []).slice(0, 20).map(function (f, i) {
      return {
        id: f.id ? String(f.id) : 'f' + Date.now().toString(36) + i,
        name: text_(f.name, 40, '항목 이름') || '항목 ' + (i + 1),
        type: FIELD_TYPES.indexOf(f.type) >= 0 ? f.type : 'text',
        options: f.type === 'select'
          ? (f.options || []).map(function (o) { return text_(o, 40, '선택지'); }).filter(Boolean).slice(0, 20)
          : [],
      };
    }),
  };
  if (!db.name) throw new Error('DB 이름을 입력하세요.');
  return withLock(function () {
    if (!db.id) db.order = readAll('databases').length;
    return upsert('databases', db);
  });
}

/** DB와 그 안의 기록을 모두 지운다. */
function deleteDatabase(input) {
  const id = String(input.id);
  return withLock(function () {
    readAll('records').forEach(function (r) { if (r.dbId === id) unlinkRecord_(r.id); });
    readAll('records').forEach(function (r) { if (r.dbId === id) remove('records', r.id); });
    remove('databases', id);
    return { ok: true };
  });
}

// ---------- 기록 ----------

function saveRecord(input) {
  return withLock(function () {
    const db = getById('databases', String(input.dbId || ''));
    if (!db) throw new Error('데이터베이스를 찾을 수 없습니다.');
    const values = {};
    db.fields.forEach(function (f) {
      const v = input.values ? input.values[f.id] : '';
      if (f.type === 'check') values[f.id] = !!v;
      else values[f.id] = text_(v, 2000, f.name);
    });
    const rec = {
      id: input.id ? String(input.id) : '',
      dbId: db.id,
      workspace: db.workspace,
      title: text_(input.title, 200, '제목'),
      values: values,
      memo: text_(input.memo, 20000, '메모'),
      createdAt: input.createdAt || new Date().toISOString(),
    };
    if (!rec.title) throw new Error('제목을 입력하세요.');
    return upsert('records', rec);
  });
}

function deleteRecord(input) {
  return withLock(function () {
    unlinkRecord_(String(input.id));
    remove('records', String(input.id));
    return { ok: true };
  });
}

/** 지워지는 기록에 연결돼 있던 일정의 연결만 끊는다. */
function unlinkRecord_(recordId) {
  readAll('events').forEach(function (ev) {
    if (ev.recordId === recordId) {
      ev.recordId = '';
      upsert('events', ev);
    }
  });
}

// ---------- 메모·설정 ----------

function saveMemo(input) {
  return withLock(function () {
    return upsert('memos', { id: 'quick', title: '빠른 메모', text: text_(input.text, 20000, '메모') });
  });
}

function saveSettings(input) {
  if (input.theme) props_().setProperty('THEME', String(input.theme).slice(0, 40));
  return { ok: true };
}

/**
 * 편집기에서 한 번 실행: 권한 승인 + 연결 확인.
 * iCloud가 설정돼 있으면 테스트 일정을 만들었다가 바로 지운다.
 */
function testSetup() {
  Logger.log('데이터 시트: ' + spreadsheet().getUrl());
  Logger.log('Google 캘린더(업무): ' + googleCalendar('work').getName());
  Logger.log('Google 캘린더(개인): ' + googleCalendar('personal').getName());
  ['work', 'personal'].forEach(function (ws) {
    if (!iCloudConfig(ws)) {
      Logger.log('iCloud(' + ws + '): 설정 없음');
      return;
    }
    const tz = Session.getScriptTimeZone();
    const ev = {
      id: Utilities.getUuid(), title: '연결 테스트', workspace: ws, allDay: false,
      date: Utilities.formatDate(new Date(), tz, 'yyyy-MM-dd'), start: '23:00', end: '23:30',
      repeat: 'none', reminder: null,
    };
    const url = iCloudPut(ev, null);
    iCloudDelete(ws, url);
    Logger.log('iCloud(' + ws + '): 연결 성공');

}

    return api;
  })(GAS.PropertiesService, GAS.SpreadsheetApp, GAS.LockService, GAS.Session, GAS.Logger, GAS.HtmlService, GAS.CalendarApp, GAS.UrlFetchApp, GAS.Utilities);

  // google.script.run 흉내: 값을 JSON으로 직렬화하고 비동기로 돌려준다.
  function make(ok, fail) {
    return {
      withSuccessHandler: function (fn) { return make(fn, fail); },
      withFailureHandler: function (fn) { return make(ok, fn); },
      api: function (action, payload) {
        setTimeout(function () {
          var res, err;
          try { res = JSON.parse(JSON.stringify(serverApi(action, JSON.parse(JSON.stringify(payload || {}))) || null)); persist(); }
          catch (e) { err = e; }
          if (err) { if (fail) fail(err); } else if (ok) ok(res);
        }, 60);
      },
    };
  }
  window.google = { script: { run: make() } };
  window.__demoReset = function () {
    var btn = document.getElementById('demoReset');
    if (btn && btn.dataset.armed !== '1') {
      btn.dataset.armed = '1'; btn.textContent = '한 번 더 누르면 삭제';
      setTimeout(function () { btn.dataset.armed = ''; btn.textContent = '초기화'; }, 3000);

/* ===================== 순수 함수 (tests/ 에서 Node 로 검사) ===================== */
/* PURE-START */
var DOW = ['일', '월', '화', '수', '목', '금', '토'];

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function ymdParts(s) { var p = s.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
function utcOf(s) { var p = ymdParts(s); return Date.UTC(p.y, p.m - 1, p.d); }
function ymdOf(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
function addDays(s, n) { return ymdOf(utcOf(s) + n * 86400000); }
function dowOf(s) { return new Date(utcOf(s)).getUTCDay(); }
function daysBetween(a, b) { return Math.round((utcOf(b) - utcOf(a)) / 86400000); }
/** 월요일 시작 주의 첫날 */
function weekStart(s) { return addDays(s, -((dowOf(s) + 6) % 7)); }
function addMonths(ym, n) { var p = ym.split('-'); var t = (+p[0]) * 12 + (+p[1] - 1) + n; return Math.floor(t / 12) + '-' + pad2(t % 12 + 1); }
/** 월간 달력: 월요일 시작, 그 달을 덮는 주들의 날짜 배열 */
function monthGrid(ym) {
  var first = ym + '-01';
  var start = weekStart(first);
  var next = addMonths(ym, 1) + '-01';
  var weeks = [];
  for (var d = start; d < next; d = addDays(d, 7)) {
    var w = [];
    for (var i = 0; i < 7; i++) w.push(addDays(d, i));
    weeks.push(w);
  }
  return weeks;
}
function minutesOf(hm) { var p = hm.split(':'); return (+p[0]) * 60 + (+p[1]); }
function hmOf(min) { return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }
function kDate(s) { var p = ymdParts(s); return p.m + '월 ' + p.d + '일 ' + DOW[dowOf(s)] + '요일'; }

/** 반복 규칙을 고려해 그날 일정이 있는지 본다. */
function occursOn(ev, day) {
  if (day < ev.date) return false;
  if (ev.repeat === 'daily') return true;
  if (ev.repeat === 'weekly') return dowOf(day) === dowOf(ev.date);
  if (ev.repeat === 'monthly') return ymdParts(day).d === ymdParts(ev.date).d;
  return day <= (ev.endDate || ev.date);
}

/** from~to(포함) 사이에 실제로 열리는 일정: [{ev, day}] */
function occurrences(events, from, to) {
  var out = [];
  for (var d = from; d <= to; d = addDays(d, 1)) {
    for (var i = 0; i < events.length; i++) if (occursOn(events[i], d)) out.push({ ev: events[i], day: d });
  }
  return out;
}

/** 하루 안에서 겹치는 일정을 나란히 놓도록 줄(lane)을 나눈다. items: [{ev}] (시간 일정만) */
function layoutDay(items) {
  var sorted = items.slice().sort(function (a, b) {
    return a.ev.start < b.ev.start ? -1 : a.ev.start > b.ev.start ? 1 : (a.ev.end > b.ev.end ? -1 : 1);
  });
  var out = [], cluster = [], laneEnds = [], clusterEnd = '';
  function flush() {
    cluster.forEach(function (c) { c.lanes = laneEnds.length; });
    cluster = []; laneEnds = [];
  }
  sorted.forEach(function (it) {
    if (cluster.length && it.ev.start >= clusterEnd) flush();
    var lane = -1;
    for (var i = 0; i < laneEnds.length; i++) if (laneEnds[i] <= it.ev.start) { lane = i; break; }
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(''); }
    laneEnds[lane] = it.ev.end;
    var placed = { ev: it.ev, day: it.day, lane: lane, lanes: 1 };
    cluster.push(placed); out.push(placed);
    clusterEnd = cluster.length === 1 || it.ev.end > clusterEnd ? it.ev.end : clusterEnd;
  });
  flush();
  return out;
}

        (occ.length ? '' : '<p class="empty">일정이 없습니다. 시간 줄을 누르면 그 시각으로 새 일정을 만듭니다.</p>') +

/** 붙여넣거나 저장된 서식 HTML에서 안전한 태그·스타일만 남긴다. */
var SAFE_TAGS = { P: 1, DIV: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, H1: 1, H2: 1, H3: 1, UL: 1, OL: 1, LI: 1, BLOCKQUOTE: 1, HR: 1, TABLE: 1, THEAD: 1, TBODY: 1, TR: 1, TD: 1, TH: 1, SPAN: 1, FONT: 1, SUB: 1, SUP: 1 };

var SAFE_CSS = ['color', 'background-color', 'font-weight', 'font-style', 'text-decoration-line', 'text-align', 'margin-left', 'padding-left'];
function sanitizeHtml(html) {
  if (!html) return '';
  var doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
  function clean(node) {
    Array.prototype.slice.call(node.childNodes).forEach(function (c) {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      var tag = c.tagName.toUpperCase();
      if (DROP_TAGS[tag]) { c.remove(); return; }
      clean(c);
      if (!SAFE_TAGS[tag]) { while (c.firstChild) node.insertBefore(c.firstChild, c); c.remove(); return; }

      SAFE_CSS.forEach(function (prop) {

      Array.prototype.slice.call(c.attributes).forEach(function (a) { c.removeAttribute(a.name); });

      if (color && /^#?[0-9a-z]{1,20}$/i.test(color)) c.setAttribute('color', color);
      if (span) { if (/^\d{1,2}$/.test(span[0] || '')) c.setAttribute('colspan', span[0]); if (/^\d{1,2}$/.test(span[1] || '')) c.setAttribute('rowspan', span[1]); }

/* --- 검색 결과 --- */

      }) + '</section>' +

/* --- 주간 --- */
function viewWeek() {

  for (var i = 0; i < 7; i++) {

    }).join('') + '</div>';

      var s = Math.max(minutesOf(p.ev.start), startH * 60), e = Math.min(minutesOf(p.ev.end), endH * 60);

      return '<button type="button" class="ev ' + (p.ev.workspace === 'work' ? 'w' : 'p') + '" data-ev="' + p.ev.id + '" style="top:' + ((s - startH * 60) / 60 * H + 1) + 'px;height:' + Math.max(22, (e - s) / 60 * H - 3) + 'px;left:calc(' + (p.lane * w) + '% + 2px);width:calc(' + w + '% - 4px)"><b>' + esc(p.ev.title) + '</b><span class="num">' + p.ev.start + '</span></button>';
    }).join('');

    '<div class="wk"><div class="wk-scroll"><div class="wk-in">' +
      '<div class="wkh">' + head + '</div>' +
      '<div class="wka">' + allday + '</div>' +

    '</div></div></div>' +
    '<p class="help">빈 칸을 누르면 그 날짜·시각으로 새 일정을 만듭니다.</p>';
}

/* --- 월간 --- */
function viewMonth() {
  var mm = S.month, t = today(), grid = monthGrid(mm);
  var occ = occurrences(events(), grid[0][0], grid[grid.length - 1][6]), byDay = {};
  occ.forEach(function (o) { (byDay[o.day] = byDay[o.day] || []).push(o.ev); });

function fieldText(f, v) {
  if (f.type === 'check') return v ? '✓' : '';

  return v == null ? '' : String(v);
}

  var recs = S.data.records.filter(function (r) { return r.dbId === db.id; }).sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });

/* ===================== 저장 동작 ===================== */
function busy(form, on) {

  if (b) { b.disabled = on; if (on) { b.dataset.label = b.textContent; b.textContent = '저장 중…'; } else if (b.dataset.label) b.textContent = b.dataset.label; }
}
function showErr(id, msg) { var e = $(id); if (e) { e.textContent = msg; e.hidden = false; } else toast(msg, true); }

function submitEvent(form) {
  var ws = form.querySelector('#eWs .on').getAttribute('data-v');

  var ev = {

    reminder: $('eRem').value, recordId: $('eRec').value, location: $('eLoc').value, memo: $('eMemo').value,
    toGoogle: $('eG').checked, toApple: $('eI').checked
  };
  if (!ev.title.trim()) return showErr('eErr', '제목을 입력하세요.');
  if (!all && ev.end <= ev.start) return showErr('eErr', '종료 시간이 시작 시간보다 늦어야 합니다.');
  busy(form, true);
  call('saveEvent', ev).then(function (saved) {

    closeDialog(); render();

    if (warn.length) toast('앱에는 저장했지만 외부 캘린더 기록에 실패했습니다. ' + warn.join(' / '), true);
    else toast('저장했습니다' + (saved.toGoogle || saved.toApple ? ' · ' + [saved.toGoogle ? 'Google' : '', saved.toApple ? 'iCloud' : ''].filter(Boolean).join(', ') + ' 캘린더에도 기록' : ''));
  }).catch(function (e) { busy(form, false); showErr('eErr', e.message); });

/* ===================== 이벤트 연결 ===================== */
function go(screen, opts) {
  opts = opts || {};
  S.screen = screen;
  if (screen === 'dash') { if (opts.day) S.day = opts.day; else if (!S.day) S.day = today(); if (!opts.keepQ) S.q = ''; S.open = S.day === today() ? 'home' : 'cal'; S.miniMonth = S.day.slice(0, 7); }
  if (screen === 'week') { S.weekOf = opts.day || S.day || today(); S.open = 'cal'; }
  if (screen === 'month') { S.month = (opts.day || S.day || today()).slice(0, 7); S.open = 'cal'; }
  if (screen === 'db') {
    if (opts.db && opts.db !== S.dbId) { S.dbId = opts.db; S.recId = ''; }
    if (opts.rec) S.recId = opts.rec;
    S.newRec = !!opts.newRec;
    var db = dbById(S.dbId); if (db) S.open = db.workspace;
  }
  if (screen === 'settings') S.open = 'set';
  $('app').classList.remove('nav-open');
  render();
  $('main').scrollTop = 0;
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-acc],[data-ws],[data-go],[data-act],[data-ev],[data-rec],[data-theme],[data-del-task],[data-slot]');
  if (!el) return;

  if (el.hasAttribute('data-acc')) {
    var id = el.getAttribute('data-acc');
    S.open = S.open === id ? '' : id;
    var acc = el.parentElement, open = S.open === id;
    Array.prototype.forEach.call(acc.parentElement.children, function (sib) {
      var on = sib === acc && open;
      sib.classList.toggle('open', on);
      sib.querySelector('.acc-h').setAttribute('aria-expanded', String(on));
    });
    return;
  }
  if (el.hasAttribute('data-ws') && el.closest('.seg3')) { S.ws = el.getAttribute('data-ws'); render(); return; }
  if (el.hasAttribute('data-theme')) {
    S.theme = applyTheme(el.getAttribute('data-theme'));
    renderMain();
    call('saveSettings', { theme: S.theme }).catch(function (err) { toast('테마를 저장하지 못했습니다: ' + err.message, true); });
    return;
  }
  if (el.hasAttribute('data-del-task')) { deleteTask(el.getAttribute('data-del-task')); return; }

  var act = el.getAttribute('data-act');
  if (act) { e.preventDefault(); return doAct(act, el); }

  if (el.hasAttribute('data-ev')) {
    e.preventDefault(); e.stopPropagation();
    var ev = evById(el.getAttribute('data-ev'));
    if (ev) eventDialog(JSON.parse(JSON.stringify(ev)));
    return;
  }
  if (el.hasAttribute('data-go')) {
    e.preventDefault();
    go(el.getAttribute('data-go'), { day: el.getAttribute('data-day'), db: el.getAttribute('data-db'), rec: el.getAttribute('data-rec') });
    return;
  }
  if (el.tagName === 'TR' && el.hasAttribute('data-rec')) { S.recId = el.getAttribute('data-rec'); S.newRec = false; renderMain(); return; }
  if (el.hasAttribute('data-slot') && e.target === el) {
    // 빈 시간 칸을 누르면 그 시각(30분 단위)으로 새 일정
    var rect = el.getBoundingClientRect();
    var min = Math.floor(((e.clientY - rect.top) / 48 * 60) / 30) * 30 + (+el.getAttribute('data-min-hour')) * 60;
    eventDialog(newEventDefaults({ date: el.getAttribute('data-slot'), start: hmOf(Math.min(min, 22 * 60 + 30)) }));
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('ov').hidden) { closeDialog(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button],tr[data-rec]')) { e.preventDefault(); e.target.click(); }
});

function doAct(act, el) {
  var t = today();
  switch (act) {
    case 'open-nav': $('app').classList.add('nav-open'); break;
    case 'close-nav': $('app').classList.remove('nav-open'); break;
    case 'mini': S.miniMonth = addMonths(S.miniMonth || t.slice(0, 7), +el.getAttribute('data-n')); renderSide(); break;
    case 'shift':
      var n = +el.getAttribute('data-n');
      if (S.screen === 'dash') { S.day = addDays(S.day, n); S.miniMonth = S.day.slice(0, 7); }
      if (S.screen === 'week') S.weekOf = addDays(S.weekOf, 7 * n);
      if (S.screen === 'month') S.month = addMonths(S.month, n);
      render(); break;
    case 'this-week': S.weekOf = t; render(); break;
    case 'this-month': S.month = t.slice(0, 7); render(); break;
    case 'focus-search': go('dash', { day: S.day || t }); setTimeout(function () { var q = $('q'); if (q) q.focus(); }, 30); break;
    case 'clear-search': S.q = ''; render(); break;
    case 'new-event': eventDialog(newEventDefaults({ date: el.getAttribute('data-date'), recordId: el.getAttribute('data-rec') })); break;
    case 'dlg-event': eventDialog(newEventDefaults({})); break;
    case 'dlg-task': taskDialog(); break;
    case 'dlg-rec': recDialog(); break;
    case 'close-dlg': closeDialog(); break;
    case 'del-ev': confirmThen(el, '정말 삭제할까요? (다시 누르면 삭제)', function () { deleteEvent($('evForm').getAttribute('data-id')); }); break;
    case 'new-rec': S.newRec = true; S.recId = ''; renderMain(); setTimeout(function () { var x = $('recTitle'); if (x) x.focus(); }, 30); break;
    case 'cancel-rec': S.newRec = false; renderMain(); break;
    case 'del-rec': confirmThen(el, '정말 삭제할까요? (다시 누르면 삭제)', function () { deleteRecord(S.recId); }); break;
    case 'new-db': dbDialog({ id: '', name: '', workspace: el.getAttribute('data-ws') || 'work', fields: [{ id: '', name: '', type: 'text', options: [] }] }); break;
    case 'edit-db': dbDialog(dbById(el.getAttribute('data-db'))); break;
    case 'add-field': readDbForm(); S.editDb.fields.push({ id: '', name: '', type: 'text', options: [] }); renderDbDialog(); break;
    case 'del-field': readDbForm(); S.editDb.fields.splice(+el.getAttribute('data-fi'), 1); renderDbDialog(); break;
    case 'del-db': confirmThen(el, '기록까지 모두 지워집니다. 다시 누르면 삭제', function () { deleteDb(S.editDb.id); }); break;
  }
}
/** 브라우저 confirm() 대신, 같은 버튼을 한 번 더 눌러야 실행한다. */
function confirmThen(el, msg, fn) {
  if (el.getAttribute('data-confirm') === '1') return fn();
  var label = el.textContent;
  el.setAttribute('data-confirm', '1'); el.textContent = msg;
  setTimeout(function () { if (el.isConnected) { el.setAttribute('data-confirm', '0'); el.textContent = label; } }, 4000);
}

document.addEventListener('submit', function (e) {

      upsertLocal(S.data.tasks, saved); S.taskId = saved.id; if (isDlg) closeDialog(); renderMain(); toast('할 일을 추가했습니다');

function deleteDb(id) {

var tkTimer, tkPending = '', tkQueue = Promise.resolve(), tkRange = null;
function readTaskEditor() {
  var box = document.querySelector('.ted[data-tk-id]'); if (!box) return;
  var id = box.getAttribute('data-tk-id');
  var task = S.data.tasks.filter(function (x) { return x.id === id; })[0]; if (!task) return;
  var html = $('tDoc').innerHTML;
  task.detail = hasDetail(html) ? sanitizeHtml(html) : '';
  task.title = $('tkTitle').value;
  task.workspace = $('tkWs').value;
  task.due = $('tkDue').value;
  tkPending = id;
}
function flushTaskSave() {
  clearTimeout(tkTimer);
  var id = tkPending; tkPending = '';
  var task = S.data.tasks.filter(function (x) { return x.id === id; })[0]; if (!task) return;
  var st = $('tkSaved');
  if (!task.title.trim()) { if (st) st.textContent = '제목을 입력해야 저장됩니다'; return; }
  var snap = JSON.parse(JSON.stringify(task));
  if (st) st.textContent = '저장 중…';
  // 저장은 순서대로 하나씩 보낸다 (늦게 도착한 응답이 새 내용을 덮지 않도록).
  tkQueue = tkQueue.then(function () { return call('saveTask', snap); }).then(function (saved) {
    var local = S.data.tasks.filter(function (x) { return x.id === id; })[0];
    if (local) local.updatedAt = saved.updatedAt;
    var s2 = $('tkSaved'); if (s2 && !tkPending) s2.textContent = '저장됨';
    var row = document.querySelector('[data-tk-pick="' + id + '"]');
    if (row) {
      var dot = row.querySelector('.dot');
      if (hasDetail(snap.detail) && !dot) row.insertAdjacentHTML('beforeend', '<i class="dot" title="상세 내용 있음"></i>');
      if (!hasDetail(snap.detail) && dot) dot.remove();
    }
  }).catch(function (err) { var s2 = $('tkSaved'); if (s2) s2.textContent = '저장 실패: ' + err.message; });
}
function pickTask(id) {
  if (tkPending) { readTaskEditor(); flushTaskSave(); }
  S.taskId = id; renderMain();
}
document.addEventListener('selectionchange', function () {
  var d = $('tDoc'), sel = window.getSelection();

});
// 도구 버튼을 눌러도 편집 영역의 커서·선택이 풀리지 않게 한다.
['mousedown', 'pointerdown'].forEach(function (t) {

});
document.addEventListener('click', function (e) {

  if (pick) { pickTask(pick.getAttribute('data-tk-pick')); return; }
  var openB = e.target.closest('[data-tk-open]');
  if (openB) { S.taskId = openB.getAttribute('data-tk-open'); S.q = ''; go('dash', { day: S.day || today() }); return; }
  var pal = document.querySelector('.tbar .pal');
  var btn = e.target.closest('.tbar button[data-cmd]');
  if (pal && (!btn || btn.getAttribute('data-cmd') !== 'pal')) pal.remove();
  if (!btn) return;
  var d = $('tDoc'); if (!d) return;
  var cmd = btn.getAttribute('data-cmd'), val = btn.getAttribute('data-val');
  if (cmd === 'pal') {
    if (pal && pal.getAttribute('data-kind') === val) return;
    var colors = val === 'color' ? TB_COLORS : TB_MARKS;
    btn.parentNode.insertAdjacentHTML('beforeend', '<div class="pal" data-kind="' + val + '" style="left:' + btn.offsetLeft + 'px">' + colors.map(function (c) {
      return '<button type="button" data-cmd="' + (val === 'color' ? 'foreColor' : 'hiliteColor') + '" data-val="' + c + '" title="' + (c === 'transparent' ? '형광펜 지우기' : c) + '" style="background:' + (val === 'color' ? c : c === 'transparent' ? 'var(--t-surface)' : c) + '">' + (c === 'transparent' ? '✕' : '') + '</button>';
    }).join('') + '</div>');
    return;
  }
  runDocCommand(cmd, val);
});
function runDocCommand(cmd, val) {
  var d = $('tDoc'); if (!d) return;
  d.focus();
  if (tkRange) { var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(tkRange); }
  document.execCommand('styleWithCSS', false, cmd === 'foreColor' || cmd === 'hiliteColor');
  if (cmd === 'table') {
    var row = '<tr><td><br></td><td><br></td><td><br></td></tr>';
    document.execCommand('insertHTML', false, '<table data-new="1"><tbody>' + row + row + row + '</tbody></table><p><br></p>');
    var tb = d.querySelector('table[data-new]');
    if (tb) {
      tb.removeAttribute('data-new');
      var r = document.createRange(); r.setStart(tb.querySelector('td'), 0); r.collapse(true);
      var s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(r);
    }
  } else if (cmd === 'formatBlock') {
    document.execCommand('formatBlock', false, '<' + val + '>');
  } else {
    document.execCommand(cmd, false, val || null);
  }
  d.dispatchEvent(new Event('input', { bubbles: true }));
}
document.addEventListener('paste', function (e) {

call('bootstrap').then(function (data) {

  go('dash');
  $('loading').hidden = true;
  // 매분 현재 시각 선을 옮긴다 (입력 중이 아닐 때만).
  setInterval(function () {
    var a = document.activeElement;
    if ($('ov').hidden && !(a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable)) && (S.screen === 'dash' || S.screen === 'week')) renderMain();
  }, 60000);
}).catch(function (e) {
  $('loading').innerHTML = '불러오지 못했습니다.<br>' + esc(e.message) + '<br><br>잠시 후 새로고침해 보세요.';
});
</script>

  background:rgba(0,0,0,.72);color:#fff;padding:6px 8px 6px 10px;border-radius:999px">

  <button id="demoReset" onclick="__demoReset()" style="font:inherit;border:0;border-radius:999px;padding:3px 8px;background:#fff;color:#000;cursor:pointer">초기화</button>
</div>
